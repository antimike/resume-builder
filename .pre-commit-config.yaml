# Block commits that stage secrets. `system` hook: uses the gitleaks on PATH.
# After cloning on a new machine: `pre-commit install` (or `mani run install-hooks`).
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
